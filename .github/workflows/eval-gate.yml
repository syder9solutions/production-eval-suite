name: Eval-Gated CI Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  eval-gate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          pytest tests -v

      - name: Enforce CI Evaluation Regression Gate
        run: |
          python src/ci_gate.py --check-regressed
